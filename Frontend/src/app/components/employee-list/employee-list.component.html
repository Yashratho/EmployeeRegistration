<div class="card shadow-sm mx-auto" style="max-width: 1000px;">
  <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
    <h4 class="mb-0 text-primary fw-bold">Employee Directory</h4>
    <a routerLink="/employee/new" class="btn btn-primary px-4 fw-semibold shadow-sm">
      + Add Employee
    </a>
  </div>
  
  <div class="card-body p-4">
    <div class="row mb-4">
      <div class="col-md-6 col-lg-5">
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white text-muted">Search</span>
          <input type="text" class="form-control border-start-0" 
                 placeholder="Type Name or Mobile No..." 
                 [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()">
        </div>
      </div>
    </div>

    <div class="table-responsive shadow-sm rounded border">
      <table class="table table-hover table-striped align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="py-3 px-3 text-center" style="width: 80px;">ID</th>
            <th class="py-3 px-3">Name</th>
            <th class="py-3 px-3 text-center">Mobile Number</th>
            <th class="py-3 px-3 text-center" style="width: 100px;">Age</th>
            <th class="py-3 px-3 text-center" style="width: 180px;">Actions</th>
          </tr>
        </thead>
        <tbody class="border-top-0">
          <tr *ngFor="let emp of paginatedEmployees">
            <td class="text-center fw-semibold text-muted">{{ emp.employeeId }}</td>
            <td class="px-3 fw-medium">{{ emp.employeeName }}</td>
            <td class="text-center">{{ emp.mobileNum }}</td>
            <td class="text-center">{{ emp.age }}</td>
            <td class="text-center">
              <a [routerLink]="['/employee/edit', emp.employeeId]" class="btn btn-sm btn-outline-primary me-2 px-3">Edit</a>
              <button class="btn btn-sm btn-outline-danger px-3" (click)="deleteEmployee(emp.employeeId)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="paginatedEmployees.length === 0">
            <td colspan="5" class="text-center py-5 text-muted">
              <h5 class="fw-normal mb-0">No employees found.</h5>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end mt-4" *ngIf="filteredEmployees.length > 0">
      <nav *ngIf="totalPages > 1">
        <ul class="pagination mb-0 shadow-sm">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <a class="page-link px-3" href="javascript:void(0)" (click)="changePage(currentPage - 1)">Previous</a>
          </li>
          <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index" [class.active]="currentPage === i + 1">
            <a class="page-link" href="javascript:void(0)" (click)="changePage(i + 1)">{{ i + 1 }}</a>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <a class="page-link px-3" href="javascript:void(0)" (click)="changePage(currentPage + 1)">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
